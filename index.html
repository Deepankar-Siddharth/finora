<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Finora — a modern personal finance dashboard for tracking income, expenses, budgets, and savings." />
    <title>Finora — Personal Finance Dashboard</title>
    <script>
      // Apply the persisted theme before paint to avoid a flash of the
      // wrong theme on load. 'system' follows prefers-color-scheme.
      ;(function () {
        try {
          var stored = localStorage.getItem('finora_settings')
          var theme = 'system'
          if (stored) {
            var parsed = JSON.parse(stored)
            if (parsed && (parsed.theme === 'light' || parsed.theme === 'dark' || parsed.theme === 'system')) {
              theme = parsed.theme
            }
          }
          var resolved = theme === 'system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : theme
          document.documentElement.classList.add(resolved)
        } catch (e) {
          document.documentElement.classList.add('light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
